    container_name: sohail-portfolio-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mohammadsohailshahquadri14_db_user:Yashafi14@ac-eeqmsmn-shard-00-00.vgpgxzf.mongodb.net:27017,ac-eeqmsmn-shard-00-01.vgpgxzf.mongodb.net:27017,ac-eeqmsmn-shard-00-02.vgpgxzf.mongodb.net:27017/?ssl=true&replicaSet=atlas-3c6m0z-shard-0&authSource=admin&appName=Cluster0
